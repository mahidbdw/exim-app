<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Code Finder - Hierarchical</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2e;
            --bg-card: #1e2842;
            --accent: #00d9ff;
            --accent-glow: rgba(0, 217, 255, 0.3);
            --text-primary: #e8edf4;
            --text-secondary: #8a94a8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #00ff88;
            --level-2: #7c3aed;
            --level-4: #ec4899;
            --level-6: #f59e0b;
            --level-8: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 20% 30%, rgba(0, 217, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 80% 70%, rgba(0, 255, 136, 0.06) 0px, transparent 50%);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .loading-section {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .loading-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 100%);
            opacity: 0.3;
        }

        .loader {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .search-section {
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .search-section.active {
            opacity: 1;
            transform: translateY(0);
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        #searchInput {
            width: 100%;
            padding: 18px 20px 18px 56px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.1rem;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        #searchInput::placeholder {
            color: var(--text-secondary);
        }

        .results-info {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .results-count {
            color: var(--accent);
            font-weight: 600;
        }

        .results-container {
            display: grid;
            gap: 24px;
        }

        .hierarchy-tree {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tree-level {
            margin-left: 0;
            position: relative;
        }

        .tree-level-2 { margin-left: 30px; }
        .tree-level-4 { margin-left: 60px; }
        .tree-level-6 { margin-left: 90px; }
        .tree-level-8 { margin-left: 120px; }

        .tree-item {
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            border-left: 3px solid transparent;
        }

        .tree-item::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 50%;
            width: 20px;
            height: 2px;
            background: var(--border);
        }

        .tree-level .tree-item:first-child::before {
            display: none;
        }

        .tree-item-2 {
            background: rgba(124, 58, 237, 0.1);
            border-left-color: var(--level-2);
        }

        .tree-item-4 {
            background: rgba(236, 72, 153, 0.1);
            border-left-color: var(--level-4);
        }

        .tree-item-6 {
            background: rgba(245, 158, 11, 0.1);
            border-left-color: var(--level-6);
        }

        .tree-item-8 {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: var(--level-8);
        }

        .tree-item:hover {
            transform: translateX(4px);
            background: var(--bg-secondary);
        }

        .hs-code {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
            font-size: 1.1rem;
        }

        .hs-code-2 { color: var(--level-2); font-size: 1.3rem; }
        .hs-code-4 { color: var(--level-4); }
        .hs-code-6 { color: var(--level-6); }
        .hs-code-8 { color: var(--level-8); }

        .commodity-text {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .highlight {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 500;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .status-message {
            background: var(--bg-secondary);
            border-left: 4px solid var(--success);
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--text-primary);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .error-message {
            border-left-color: #ff4444 !important;
        }

        .file-name {
            color: var(--accent);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .stat-value {
            color: var(--accent);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-color-2 { background: var(--level-2); }
        .legend-color-4 { background: var(--level-4); }
        .legend-color-6 { background: var(--level-6); }
        .legend-color-8 { background: var(--level-8); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HS Code Finder</h1>
            <p class="subtitle">Hierarchical search for harmonized system codes</p>
        </header>

        <div class="loading-section" id="loadingSection">
            <div class="loader"></div>
            <div class="loading-text">Loading HS code data...</div>
        </div>

        <div id="statusMessage"></div>

        <div class="search-section" id="searchSection">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Start typing to search commodities..."
                    autocomplete="off"
                />
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color legend-color-2"></div>
                    <span>Chapter (2 digits)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-color-4"></div>
                    <span>Heading (4 digits)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-color-6"></div>
                    <span>Subheading (6 digits)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-color-8"></div>
                    <span>Tariff Item (8 digits)</span>
                </div>
            </div>
            <div class="results-info" id="resultsInfo"></div>
        </div>

        <div class="results-container" id="resultsContainer"></div>
    </div>

    <script>
        // CONFIGURATION: Set your Excel file name here
        const EXCEL_FILE_NAME = 'hs-codes.xlsx'; // Change this to your actual file name
        
        let hsData = [];
        const searchInput = document.getElementById('searchInput');
        const searchSection = document.getElementById('searchSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsInfo = document.getElementById('resultsInfo');
        const statusMessage = document.getElementById('statusMessage');
        const loadingSection = document.getElementById('loadingSection');

        // Auto-load Excel file on page load
        window.addEventListener('DOMContentLoaded', loadExcelFile);
        searchInput.addEventListener('input', handleSearch);

        async function loadExcelFile() {
            try {
                const response = await fetch(EXCEL_FILE_NAME);
                
                if (!response.ok) {
                    throw new Error(`File not found: ${EXCEL_FILE_NAME}`);
                }

                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                
                // Parse data
                hsData = jsonData
                    .filter(row => row[0] && row[1])
                    .map(row => ({
                        hsCode: String(row[0]).trim(),
                        commodities: String(row[1]).split(',').map(c => c.trim()).filter(c => c),
                        fullText: String(row[1]).toLowerCase()
                    }));
                
                const totalCommodities = hsData.reduce((sum, item) => sum + item.commodities.length, 0);
                
                loadingSection.style.display = 'none';
                showStatus(`
                    Successfully loaded data from <span class="file-name">${EXCEL_FILE_NAME}</span>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-value">${hsData.length}</span> HS Codes
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${totalCommodities}</span> Commodities
                        </div>
                    </div>
                `);
                searchSection.classList.add('active');
                searchInput.focus();
            } catch (error) {
                loadingSection.style.display = 'none';
                showStatus(`
                    <div class="error-message">
                        Error loading file: ${error.message}<br>
                        <small style="margin-top: 8px; display: block;">
                            Make sure <span class="file-name">${EXCEL_FILE_NAME}</span> is in the same directory as this HTML file.
                        </small>
                    </div>
                `, true);
                console.error('Error loading Excel file:', error);
            }
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            
            if (!query) {
                resultsContainer.innerHTML = '';
                resultsInfo.innerHTML = '';
                return;
            }

            // Find all matching HS codes
            const matchingCodes = hsData.filter(item => 
                item.fullText.includes(query)
            );

            if (matchingCodes.length === 0) {
                displayNoResults();
                return;
            }

            // Build hierarchical structure
            const hierarchy = buildHierarchy(matchingCodes, query);
            displayHierarchy(hierarchy, query);
        }

        function buildHierarchy(matchingCodes, query) {
            const hierarchyMap = new Map();

            matchingCodes.forEach(item => {
                const code = item.hsCode;
                const codeLength = code.length;

                // Add the matched code itself
                if (!hierarchyMap.has(code)) {
                    hierarchyMap.set(code, item);
                }

                // Add parent codes (2, 4, 6 digits) if they exist in data
                if (codeLength >= 2) {
                    const chapter = code.substring(0, 2);
                    addParentCode(hierarchyMap, chapter);
                }
                if (codeLength >= 4) {
                    const heading = code.substring(0, 4);
                    addParentCode(hierarchyMap, heading);
                }
                if (codeLength >= 6) {
                    const subheading = code.substring(0, 6);
                    addParentCode(hierarchyMap, subheading);
                }
            });

            // Convert map to sorted array
            return Array.from(hierarchyMap.values()).sort((a, b) => {
                // Sort by HS code
                return a.hsCode.localeCompare(b.hsCode);
            });

            function addParentCode(map, parentCode) {
                if (!map.has(parentCode)) {
                    const parentData = hsData.find(item => item.hsCode === parentCode);
                    if (parentData) {
                        map.set(parentCode, parentData);
                    }
                }
            }
        }

        function displayHierarchy(hierarchy, query) {
            resultsInfo.innerHTML = `Found <span class="results-count">${hierarchy.length}</span> code${hierarchy.length !== 1 ? 's' : ''} in hierarchy`;

            // Group by chapter (first 2 digits)
            const chapters = new Map();
            
            hierarchy.forEach(item => {
                const chapter = item.hsCode.substring(0, 2);
                if (!chapters.has(chapter)) {
                    chapters.set(chapter, []);
                }
                chapters.get(chapter).push(item);
            });

            let html = '';
            chapters.forEach((items, chapter) => {
                html += '<div class="hierarchy-tree">';
                html += buildTreeHTML(items, query);
                html += '</div>';
            });

            resultsContainer.innerHTML = html;
        }

        function buildTreeHTML(items, query) {
            let html = '';
            const processed = new Set();

            // Sort items by code length and value
            items.sort((a, b) => {
                if (a.hsCode.length !== b.hsCode.length) {
                    return a.hsCode.length - b.hsCode.length;
                }
                return a.hsCode.localeCompare(b.hsCode);
            });

            items.forEach(item => {
                if (processed.has(item.hsCode)) return;
                processed.add(item.hsCode);

                const level = item.hsCode.length;
                const indent = level === 2 ? 0 : level === 4 ? 2 : level === 6 ? 4 : 6;
                
                html += `<div class="tree-level tree-level-${level}">`;
                html += `<div class="tree-item tree-item-${level}">`;
                html += `<div class="hs-code hs-code-${level}">${item.hsCode}</div>`;
                html += `<div class="commodity-text">${highlightText(item.commodities.join(', '), query)}</div>`;
                html += `</div>`;
                html += `</div>`;
            });

            return html;
        }

        function highlightText(text, query) {
            const lowerText = text.toLowerCase();
            const lowerQuery = query.toLowerCase();
            
            let result = text;
            let index = lowerText.indexOf(lowerQuery);
            
            if (index !== -1) {
                const before = text.substring(0, index);
                const match = text.substring(index, index + query.length);
                const after = text.substring(index + query.length);
                result = `${before}<span class="highlight">${match}</span>${after}`;
            }
            
            return result;
        }

        function displayNoResults() {
            resultsInfo.innerHTML = `Found <span class="results-count">0</span> results`;
            resultsContainer.innerHTML = `
                <div class="no-results">
                    <div class="no-results-icon">🔍</div>
                    <div>No matching commodities found</div>
                    <div style="margin-top: 8px; font-size: 0.9rem;">Try a different search term</div>
                </div>
            `;
        }

        function showStatus(message, isError = false) {
            statusMessage.innerHTML = `
                <div class="status-message ${isError ? 'error-message' : ''}">
                    ${message}
                </div>
            `;
            
            if (!isError) {
                setTimeout(() => {
                    statusMessage.innerHTML = '';
                }, 8000);
            }
        }
    </script>
</body>
</html>
